upstream api {
    server api:80;
}

upstream web {
    server web:3000;
}

upstream client {
    server client:3001;
}

upstream marketing {
    server marketing:3002;
}

server {
    listen 80;
    server_name _;

    # Redirect HTTP to HTTPS in production
    # return 301 https://$host$request_uri;

    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # Company-facing client-portal, mounted at /portal (Next.js basePath —
    # see apps/client-portal/next.config.ts). No path-stripping here: the
    # request URI is forwarded to client-portal as-is (proxy_pass has no
    # trailing path), since Next's own basePath already expects /portal.
    #
    # The exact-match block below matters: nginx auto-redirects a bare
    # request for a prefix location's own name minus its trailing slash
    # (i.e. "/portal" -> 301 -> "/portal/") whenever only `location /portal/`
    # exists. Next's basePath canonicalizes the opposite way ("/portal/" ->
    # 308 -> "/portal"), so the two together formed an infinite redirect
    # loop for the app's own root. An exact `=` match for the bare path
    # bypasses that implicit slash-redirect entirely.
    location = /portal {
        proxy_pass http://client;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }

    location /portal/ {
        proxy_pass http://client;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }

    # Internal back-office admin-portal, mounted at /admin (Next.js basePath
    # — see apps/admin-portal/next.config.ts). Same exact-match-plus-prefix
    # pair as /portal above, for the same reason: without the exact match,
    # bare "/admin" 301s to "/admin/" which 308s back to "/admin", looping.
    location = /admin {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }

    location /admin/ {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }

    # Public marketing site now owns the root — admin-portal moved to
    # /admin above (it used to be the "/" catch-all before marketing had
    # its own deploy).
    location / {
        proxy_pass http://marketing;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }
}
