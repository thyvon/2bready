services:
  nginx:
    image: nginx:alpine
    ports:
      - '${NGINX_PORT:-8082}:80'
    volumes:
      - ./devops/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
      - marketing
      - client
      - tp
    networks:
      - 2bready

  api:
    build:
      context: ./2bready-api
      dockerfile: Dockerfile
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      # This is an explicit allowlist, not env_file — a var only existing in
      # .env.production is invisible to the container until it's added here
      # too. Read by AppServiceProvider's VerifyEmail::createUrlUsing and
      # GoogleAuthController for building user-facing links (this API has no
      # web routes of its own), so both must point at the real frontend
      # paths, never the dev-default localhost fallback in config/app.php.
      FRONTEND_URL: ${FRONTEND_URL}
      ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CLIENT: predis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
    volumes:
      - api_storage:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - 2bready

  web:
    build:
      context: ./2bready-web
      dockerfile: apps/admin-portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-2bReady}
        NEXT_PUBLIC_BASE_PATH: /admin
    networks:
      - 2bready

  client:
    build:
      context: ./2bready-web
      dockerfile: apps/client-portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-2bReady}
        NEXT_PUBLIC_BASE_PATH: /portal
    networks:
      - 2bready

  tp:
    build:
      context: ./2bready-web
      dockerfile: apps/tp-portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_TP_APP_NAME:-2bReady TP Portal}
        NEXT_PUBLIC_BASE_PATH: /tp-portal
    networks:
      - 2bready

  marketing:
    build:
      context: ./2bready-web
      dockerfile: apps/marketing/Dockerfile
      args:
        # Same-origin path split (not a subdomain) — admin-portal and
        # client-portal both live on this same domain, so these are relative
        # paths, not different hosts. See apps/marketing/src/lib/admin-url.ts
        # and apps/marketing/src/lib/client-portal-url.ts.
        NEXT_PUBLIC_ADMIN_PORTAL_URL: /admin
        NEXT_PUBLIC_CLIENT_PORTAL_URL: /portal
    networks:
      - 2bready

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${DB_USERNAME}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - 2bready

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - 2bready

volumes:
  postgres_data:
  redis_data:
  api_storage:

networks:
  2bready:
    driver: bridge
