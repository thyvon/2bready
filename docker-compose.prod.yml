services:
  # Cloudflare Tunnel — replaces direct port exposure on nginx.
  # All external traffic enters through Cloudflare (TLS, CDN, DDoS protection).
  # Requires CLOUDFLARE_TUNNEL_TOKEN in .env.production.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: 2bready_cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - 2bready

  # Edge reverse proxy — path-routes to all 5 upstreams
  nginx:
    image: nginx:alpine
    container_name: 2bready_nginx
    restart: unless-stopped
    # No ports exposed in production — Cloudflare Tunnel handles external access.
    # For non-Cloudflare setups, uncomment the port mapping below:
    # ports:
    #   - '${NGINX_PORT:-8082}:80'
    volumes:
      - ./devops/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      marketing:
        condition: service_healthy
      client:
        condition: service_healthy
      tp:
        condition: service_healthy
    networks:
      - 2bready
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Laravel API (nginx + PHP-FPM + scheduler + Horizon via supervisor)
  api:
    build:
      context: ./2bready-api
      dockerfile: Dockerfile
    container_name: 2bready_api
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}
      FRONTEND_URL: ${FRONTEND_URL}
      ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_CLIENT: predis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
    volumes:
      - api_storage:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - 2bready
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Admin portal — back office (basePath /admin)
  web:
    build:
      context: ./2bready-web
      dockerfile: apps/admin-portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-2bReady}
        NEXT_PUBLIC_BASE_PATH: /admin
    container_name: 2bready_web
    restart: unless-stopped
    networks:
      - 2bready
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/admin"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Client portal — company-facing (basePath /portal)
  client:
    build:
      context: ./2bready-web
      dockerfile: apps/client-portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-2bReady}
        NEXT_PUBLIC_BASE_PATH: /portal
    container_name: 2bready_client
    restart: unless-stopped
    networks:
      - 2bready
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/portal"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # TP portal — third-party auditor self-service (basePath /tp-portal)
  tp:
    build:
      context: ./2bready-web
      dockerfile: apps/tp-portal/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_TP_APP_NAME:-2bReady TP Portal}
        NEXT_PUBLIC_BASE_PATH: /tp-portal
    container_name: 2bready_tp
    restart: unless-stopped
    networks:
      - 2bready
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/tp-portal"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Marketing site — public landing page (owns the root /)
  marketing:
    build:
      context: ./2bready-web
      dockerfile: apps/marketing/Dockerfile
      args:
        NEXT_PUBLIC_ADMIN_PORTAL_URL: /admin
        NEXT_PUBLIC_CLIENT_PORTAL_URL: /portal
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: 2bready_marketing
    restart: unless-stopped
    networks:
      - 2bready
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Chrome HTML→PDF service for SOP/certificate PDFs (Khmer font rendering)
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: 2bready_gotenberg
    restart: unless-stopped
    volumes:
      - ./2bready-api/resources/fonts:/usr/share/fonts/custom:ro
    networks:
      - 2bready

  # PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: 2bready_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - 2bready
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${DB_USERNAME}', '-d', '${DB_DATABASE}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 7 — sessions, cache, queue
  redis:
    image: redis:7-alpine
    container_name: 2bready_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - 2bready
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  api_storage:

networks:
  2bready:
    driver: bridge
