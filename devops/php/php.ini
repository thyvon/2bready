; Production PHP tuning for the API container.

; OPcache — validate_timestamps=0 disables per-request filesystem checks;
; the container is rebuilt on every deploy, so cache staleness isn't a risk.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1

memory_limit=256M
upload_max_filesize=50M
post_max_size=50M
max_execution_time=60
max_input_time=60

expose_php=Off
display_errors=Off
log_errors=On
error_log=/dev/stderr

date.timezone=UTC
